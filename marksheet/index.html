<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marksheet</title>
</head>
<body>
    <form id="marksheet-form" style="margin-bottom: 10px;">
        <div>
            <label>
                <span>Subject 1</span>
                <input type="number" step="0.1" id="sub1" name="sub1" placeholder="Enter marks for subject1">
            </label>
        </div>

        <div>
            <label>
                <span>Subject 2</span>
                <input type="number" step="0.1" id="sub2" name="sub2" placeholder="Enter marks for subject2">
            </label>
        </div>

        <div>
            <label>
                <span>Subject 3</span>
                <input type="number" step="0.1" id="sub3" name="sub3" placeholder="Enter marks for subject3">
            </label>
        </div>

        <div>
            <label>
                <span>Subject 4</span>
                <input type="number" step="0.1" id="sub4" name="sub4" placeholder="Enter marks for subject4">
            </label>
        </div>

        <div>
            <label>
                <span>Subject 5</span>
                <input type="number" step="0.1" id="sub5" name="sub5" placeholder="Enter marks for subject5">
            </label>
        </div>

        <button type="submit">Generate Marksheet</button>
    </form>

    <script src="./script.js"></script>
</body>
</html>
